name: Release

# Dispara ao empurrar uma tag de versão (ex.: v1.0.0). Gera SBOM e publica um
# GitHub Release com o SBOM anexado. Actions pinadas por SHA (supply chain).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gerar SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "DZ23 CRM ${GITHUB_REF_NAME}" \
            --notes "Notas em CHANGELOG.md. SBOM (CycloneDX) anexado." \
            sbom.cyclonedx.json
