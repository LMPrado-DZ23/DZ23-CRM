# Pre-commit do DZ23 CRM. Instale: pipx install pre-commit && pre-commit install
# Roda nos nossos addons; core Odoo e OCA de terceiros ficam de fora (ver ruff.toml).
minimum_pre_commit_version: "3.5.0"
default_language_version:
  python: python3.11
exclude: '^(addons_oca/|docs/odoo_ref/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "addons_custom"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-xml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
